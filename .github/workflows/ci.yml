name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore LitSSHmcp.slnx

      - name: Build
        run: dotnet build LitSSHmcp.slnx -c Release --no-restore

      - name: Test Core
        run: dotnet test tests/LitSSHmcp.Tests/LitSSHmcp.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Test Agent
        run: dotnet test tests/LitSSHmcp.Agent.Tests/LitSSHmcp.Agent.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Test McpServer
        run: dotnet test tests/LitSSHmcp.McpServer.Tests/LitSSHmcp.McpServer.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Test App
        run: dotnet test tests/LitSSHmcp.App.Tests/LitSSHmcp.App.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Test Web
        run: dotnet test tests/LitSSHmcp.Web.Tests/LitSSHmcp.Web.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Syntax check Web scripts
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem src/LitSSHmcp.Web/wwwroot/js/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { throw "node --check failed: $($failed -join ', ')" }
          Write-Host "node --check passed: $((Get-ChildItem src/LitSSHmcp.Web/wwwroot/js/*.js).Count) files"
