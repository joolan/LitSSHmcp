<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>LitSSHmcp 运维助手</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="login-view" class="view">
  <form id="login-form" class="login-card">
    <h1>LitSSHmcp 运维助手</h1>
    <label for="login-user">用户名</label>
    <input id="login-user" name="username" autocomplete="username" required>
    <label for="login-pass">密码</label>
    <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn" class="primary">登录</button>
    <p id="login-error" class="error" hidden></p>
    <p class="hint">局域网 Web 端 · 会话按登录用户隔离</p>
  </form>
</div>

<div id="app-view" class="view" hidden>
  <header id="topbar">
    <button id="menu-btn" class="icon-btn only-mobile" aria-label="会话列表" title="会话列表">☰</button>
    <span class="brand">LitSSHmcp</span>
    <span id="conn-dot" class="dot" title="连接状态"></span>
    <span id="turn-status" class="status"></span>
    <span class="spacer"></span>
    <button id="approval-badge" class="badge" hidden title="有待审批操作，点击展开">待审批 <b id="approval-count">0</b></button>
    <button id="memory-admin-btn" class="ghost" hidden title="团队记忆库（管理员）：查看历史、回滚、归档">记忆库</button>
    <span id="whoami" class="whoami"></span>
    <button id="logout-btn" class="ghost" title="退出登录">退出</button>
  </header>

  <div class="layout">
    <div id="backdrop" class="backdrop" hidden></div>

    <aside id="session-pane">
      <div class="pane-head">
        <span>会话</span>
        <button id="pane-close" class="ghost icon-btn only-mobile" title="收起会话列表">✕</button>
      </div>
      <button id="new-session-btn" class="primary block">＋ 新会话</button>
      <ul id="session-list"></ul>
    </aside>

    <main id="chat-pane">
      <div id="session-header">
        <span id="session-title">未选择会话</span>
        <span class="spacer"></span>
        <button id="files-btn" disabled>目录</button>
      </div>

      <button id="load-older" class="load-older" hidden>加载更早的记录</button>
      <div id="messages"></div>
      <button id="to-bottom" class="to-bottom" hidden title="回到最新">↓</button>

      <form id="composer" autocomplete="off">
        <div id="attachment-chips" class="chips" hidden></div>
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="输入任务…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button type="submit" id="send-btn" class="primary send-stop" title="发送 / 停止">发送</button>
        </div>
        <div class="composer-toolbar">
          <button type="button" id="attach-btn" class="tool-btn" title="添加图片（也可粘贴/拖拽）">＋ 图片</button>
          <button type="button" id="model-btn" class="chip" title="切换本会话模型">模型… ▾</button>
          <span class="spacer"></span>
          <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
        </div>
        <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      </form>
    </main>

    <section id="files-pane" hidden>
      <div id="files-head">
        <div id="files-path"></div>
        <span class="spacer"></span>
        <button id="files-up">上级</button>
        <button id="files-close" class="ghost">关闭</button>
      </div>
      <div id="files-list"></div>
    </section>
  </div>

  <!-- 模型选择（底部/弹层） -->
  <div id="model-sheet" class="sheet" hidden>
    <div class="sheet-head">
      <span>选择模型</span>
      <span class="spacer"></span>
      <button id="model-close" class="ghost">关闭</button>
    </div>
    <div id="model-list" class="sheet-body"></div>
  </div>

  <!-- 管理员团队记忆库：列表 + 历史版本 + 回滚/归档（仅 admin 显示入口，服务端再次校验角色） -->
  <div id="memory-admin" class="sheet memory-sheet" hidden>
    <div class="sheet-head">
      <span>团队记忆库</span>
      <span class="spacer"></span>
      <button id="memory-refresh" class="ghost" title="刷新列表">刷新</button>
      <button id="memory-close" class="ghost">关闭</button>
    </div>
    <div class="sheet-body memory-body">
      <div class="memory-toolbar">
        <label for="memory-kind">类别</label>
        <select id="memory-kind">
          <option value="">全部</option>
          <option value="task">task</option>
          <option value="script">script</option>
          <option value="asset">asset</option>
          <option value="raw">raw</option>
        </select>
        <span class="spacer"></span>
        <button id="memory-archive" class="ghost" disabled title="把选中记忆标记为 superseded（保留历史可回滚）">归档选中</button>
      </div>
      <div id="memory-list" class="memory-list"></div>
      <div class="memory-versions-head">历史版本 <span id="memory-current"></span></div>
      <div id="memory-versions" class="memory-versions"></div>
    </div>
  </div>

  <!-- 审批操作区：固定悬浮（不随聊天滚动），长会话历史下也一定可见；可收起（顶栏徽标可再展开） -->
  <div id="approval-overlay" class="appr-overlay" hidden>
    <div class="appr-overlay-head">
      <span class="appr-overlay-title">待审批操作</span>
      <span class="spacer"></span>
      <button id="approval-collapse" class="ghost">收起</button>
    </div>
    <div id="approval-strip" class="strip"></div>
  </div>
</div>

<!-- 图片全屏预览（点击遮罩/关闭按钮或 Esc 退出） -->
<div id="image-viewer" class="image-viewer" hidden role="dialog" aria-modal="true" aria-label="图片预览">
  <button id="image-viewer-close" class="image-viewer-close" title="关闭">✕</button>
  <img id="image-viewer-img" alt="图片预览">
</div>

<div id="toast" role="status" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
